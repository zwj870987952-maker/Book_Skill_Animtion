  slug: gesture-drawing-vital-force
  title: 姿态速写与生命力捕捉
  importance: critical
  importance_rationale: 动画速写与表演的原点，打破解剖死尸图，以动词意图 (Doing) 一笔抓取全身主导动力线与动量
  one_liner: 以动词意图优先于解剖细节，笔尖不离纸面划出贯通全身的单一主导动力线与三大体块反向倾斜
  intents:
  - 在动画速写与原画设计中捕捉角色的核心动作意图与情感动机
  - 提炼贯穿全身的第一笔主导动力线 (The Driving Line of Action)
  - 排查从眼睛局部细碎抠图导致全身动作僵死散架的画法缺陷
  keywords:
  - 姿态速写
  - Gesture Drawing
  - 生命力
  - Vital Force
  - 主导动力线
  - Line of Action
  - 意图动词
  - The Doing
  also_read:
