- capability_id: cap.drawn-to-life.line-economy-drawing-calories
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: line-economy-drawing-calories
  title: 线条经济学与绘画卡路里法则
  importance: high
  importance_rationale: 动画工业级生产与艺术纯度的黄金平衡，极简纯净长弧线消灭犹豫碎线与视觉卡路里消耗
  one_liner: 以最少线条承载最丰富解剖与动作信息，用大臂带动画笔消灭鸡啄米式犹豫碎线与装饰性阴影
  intents:
  - 执行线条极简化纯度提炼，降低动画绘制与上色环节的视觉干扰与计算卡路里
  - 消除犹豫试探性细碎排线 (Chicken Scratching) 并确立果断自信的长动力弧线
  - 在原画设计中去除无结构意义的琐碎皱褶，突出大体块骨骼支撑与受力走向
  keywords:
  - 线条经济学
  - Line Economy
  - 绘画卡路里
