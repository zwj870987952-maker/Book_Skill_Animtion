  description: 迪士尼动画大师讲义与生命动态速写工程手册。提供动词意图姿态速写、体积守恒挤压拉伸、直线对抗曲线跑道、0.1秒纯黑剪影测试、三大体块反向倾斜对抗、线条经济学、多级重叠拖尾跟随、角色心理故事姿态、眼神扫视先行内心戏、三维空间地平面踩踏、多声部交响动作重音与极简明晰迪士尼终极吸引力工程支持。
