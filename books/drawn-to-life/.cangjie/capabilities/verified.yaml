  - simplicity-caricature-appeal
  card: cards/line-economy-drawing-calories.md
  frontmatter:
    description: 以极致纯净的线条数量承载最大动力学与解剖信息的绘制规程。不适用于古典铜版画密集网状交叉排线雕版。
