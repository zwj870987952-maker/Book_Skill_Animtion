schema_version: 1
bundle_id: bundle.drawn-to-life
book:
  title: '生命的原画：迪士尼动画黄金20年大师讲义 (Drawn to Life: 20 Golden Years of Disney Master Classes Volume 1 & Volume 2)'
  source_pack: books/drawn-to-life
  edition: 1st Edition
  authors:
  - Walt Stanchfield
  - Don Hahn
  year: 2009
entry:
  name: drawn-to-life
  description: 经典手绘与三维动画角色设计、动态速写、生命律动与表演艺术大师级工程手册。涵盖动词意图驱动与主导动力线姿态速写 (Gesture Drawing & Vital Force)、质量与体积绝对守恒挤压拉伸 (Squash
    & Stretch)、坚韧直线对抗饱满外凸曲线力学跑道 (Straights Against Curves)、0.1 秒纯黑剪影测试与舞台空间视线引导 (Silhouette Clarity & Staging)、头胸盆三大刚体三轴反向倾斜对抗与对立平衡
    (Contrapposto & Opposing Forces)、果断纯净长动力线与线条经济学 (Line Economy & Drawing Calories)、主动力先行与次级柔性附着物正弦波滞后拖尾 (Overlap & Follow-Through)、单帧浓缩过去当下未来之意图故事表演
    (Animation Acting in a Pose)、思维先行眼神扫视跳跃与情绪顿悟眨眼节拍 (Facial Acting & Eye Direction)、环绕包裹线三维空间进深与地平面坚实重力踩踏 (Spatial Depth
    & Ground Plane)、交响乐多声部律动与爆发性动作重音 (Rhythm & Bodily Accents)、几何基本型戏剧夸张提炼与迪士尼终极吸引力 (Simplicity, Caricature & Supreme Appeal)
    黄金法则规范。
  core_principles:
  - 不要画形体是什么，要画形体在做什么（Don't draw what it is, draw what it is doing）！动作意图与生命动量永远先于局部解剖细节。
  - 严格遵循几何质量与体积守恒：挤压（Squash）必须伴随侧向膨胀展平，拉伸（Stretch）必须伴随径向纤细收束，严禁无故增减容积。
  - 直线对抗曲线是迪士尼力量设计的最高美学：支撑受力侧使用坚韧挺拔的直线作为视觉加速跑道，施力对抗侧使用饱满外凸的张力大弧线，彻底消灭均等对称香肠肢体。
  - 剪影可读性是视觉传达的绝对试金石：在 0.1 秒纯黑剪影测试下动作与情绪动机必须瞬间可读，彻底消灭轮廓切线（Tangents）与肢体模糊粘连。
  - 重力场中生命体依靠反向倾斜维持动态平衡：头、胸、盆三大刚体在三维空间中严禁平行呆滞，必须呈现多轴反向错落与空间扭矩代偿。
  - 惯性遵循多级滞后链条：主动力核心（盆骨与重心中轴）先行，次级柔性附着物（毛发、披风、松弛肌肉）沿正弦波阻尼滞后拖尾并在停顿刹车时产生超量鞭打过冲。
  - 极简是真理的终极凝练，夸张是本质的戏剧放大：消除所有消耗视觉卡路里的杂乱线条，提炼角色的深层性格特质放大 150%-200%，构筑跨越时代的终极吸引力（Appeal）。
  out_of_scope:
  - 非生物刚体工业机床齿轮啮合机械制图
  - 静态死板写实医学人体标本防腐解剖测绘
  - 纯抽象数学分形几何无重力无质量图形渲染
  stop_conditions:
  - 用户仅咨询工业齿轮制图或法医解剖标本防腐，不涉及动画、动态速写、角色设计、表演与运动规律时判停
  - 已输出明确的主导动力线规范、挤压拉伸容积公式、直曲对抗结构、剪影排查指标、多级重叠延迟时序或迪士尼表演夸张方案时判停
