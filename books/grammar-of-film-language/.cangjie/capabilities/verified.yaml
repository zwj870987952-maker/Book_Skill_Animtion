  title: 一镜到底场面调度与无剪辑景别转换
  importance: critical
  importance_rationale: 影视艺术皇冠之巅，单镜头内通过角色走位与机位三轴推拉摇移，实现全景到特写之镜头内蒙太奇
  one_liner: 在不间断长镜头中通过角色走位与机位推拉摇移，无缝实现全景、双人中景与单人特写的流态切换
  intents:
  - 编排覆盖多重戏剧节拍的一镜到底长镜头路径 (Sequence Shot / Plan-Séquence)
  - 利用角色走向或背离摄影机的物理距离自然转换大远景、中景与大特写景别
  - 结合推轨、升降与横摇穿梭于场景门框障碍物之间，设计遮挡擦镜 (Body Wipe) 等隐藏切口
