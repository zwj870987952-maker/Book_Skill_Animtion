  slug: ots-vs-clean-single
  title: 过肩外反打 vs 纯净内反打景别心理学
  importance: critical
  importance_rationale: 反打画框边缘肩膀取舍心理学，OTS 建立空间连结与心理博弈，Clean Single 剔除干扰强化孤立与情感爆破
  one_liner: 过肩外反打借由前景肩膀建立空间连结与心理博弈，纯净内反打剔除干扰强化极度孤独与情感爆破
  intents:
  - 在戏剧博弈与信息交涉阶段选用过肩外反打 (OTS) 确立无可动摇的空间真实感
  - 控制前景虚焦肩膀面积占画幅 10%-15%，杜绝前景遮挡被摄主体的眼神通道
  - 在戏剧高潮、痛下决心或秘密揭晓瞬间果断切入纯净内反打 (Clean Single) 直击灵魂
  keywords:
  - 过肩镜头
  - OTS
  - 外反打
  - 纯净单人
  - Clean Single
  - 内反打
  - 空间连结
