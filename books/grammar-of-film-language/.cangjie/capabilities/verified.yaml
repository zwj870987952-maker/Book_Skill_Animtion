  title: 视线角度对撞匹配与空间汇聚几何学
  importance: critical
  importance_rationale: 人类对目光方向的惊人神经敏感度，水平偏角对称、垂直仰俯角度互补与视线留白严格匹配
  one_liner: 严格匹配反打镜头中的视线水平朝向与仰俯互补夹角，留出对称视线留白，确立目光空间交汇
