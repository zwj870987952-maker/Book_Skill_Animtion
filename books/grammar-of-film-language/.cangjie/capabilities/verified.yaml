- capability_id: cap.grammar-of-film-language.cutting-on-action-momentum
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: cutting-on-action-momentum
  title: 动作剪辑点与动量惯性掩盖法则
  importance: critical
  importance_rationale: 利用受众大脑对高速动能的神经专注盲区，在动作做功最高潮中间帧执行切分，使物理切口隐形
  one_liner: 在起立、坐下、开门等动作做功最高潮中间帧执行镜头切分，利用人脑动量追踪惯性掩盖剪辑硬切
  intents:
  - 在角色发力动作速度最大、位移最剧烈的中间帧 (The Motion Apex) 确定黄金剪辑点
  - 在实拍与动画中预留 1 秒以上的动作重叠区 (Overlap)，执行帧级精准的位置动能对齐
  - 配合机位旋转 45° 以上与景别跳跃，彻底消除剪切痕迹实现丝滑如水的动作连贯感
  keywords:
  - 动量剪辑
  - Cutting on Action
  - 动作切分
  - 动量掩盖
  - Momentum Match
  - 帧级对齐
  - 隐形剪辑
