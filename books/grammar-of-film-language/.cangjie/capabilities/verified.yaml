schema_version: 1
bundle_id: bundle.grammar-of-film-language
book:
  title: 电影语言的语法 (Grammar of the Film Language)
  source_pack: books/grammar-of-film-language
  edition: Illustrated Revised Edition
  authors:
  - Daniel Arijon
  year: 1976
entry:
  name: grammar-of-film-language
  description: 全球影视学院与好莱坞导演工会视听语言与分镜头机位几何学第一红宝书。涵盖 180° 动作轴线守恒与移动镜头/走位四种合法越轴规程 (The 180° Action Axis & Crossing the Line)、全景建立与对称反打之三角形机位系统
    (The Triangle Principle for Two Actors)、关系博弈过肩外反打 vs 极致孤立纯净内反打景别心理学 (External OTS vs. Internal Clean Singles)、车内与吧台并排平行站位与交叉反打调度
    (Parallel Dialogue & Lateral Setups)、三人及多角色对话多边形机位重构与观察者反应 (Three-Character Setups & Axis Reorientation)、水平偏角对称与仰俯互补夹角视线对撞匹配
    (Eyeline Matching & Convergence Geometry)、屏幕运动矢量守恒与右出左入出入画对齐 (Screen Direction Continuity)、动作做功最高潮中间帧切分动量掩盖法则 (Cutting
    on Action & Momentum Match)、注视目标反应三步法主观视点系统 (The 3-Step POV System)、全景主镜头空间建立与分切覆盖装配体系 (Master Shot Technique & Coverage)、演员有动机位移引导轴线旋转与机位重置
    (Actor Blocking & Natural Axis Shift)、全景到特写镜头内蒙太奇一镜到底长镜头场面调度 (Sequence Shot & Mise-en-Scène Choreography) 经典电影语法规范。
  core_principles:
  - 180° 动作轴线是受众空间感知的绝对宪法：机位必须永久锁定在互动主体连线同侧半圆内，严禁无准备跳轴；跨越轴线必须通过镜头连续移动、角色走位换轴或中性正视镜头合法完成。
  - 三角形机位系统是影视视听语言的几何母体：以全景主镜头（Master Shot）确立地理与底边，以对称夹角与等大头部比例的两个单人反打镜头展开对峙，统领绝大多数双人场景。
  - 反打景别蕴含深层心理学：保留对方肩膀的过肩外反打（OTS）强调空间连结与心理博弈；剔除一切干扰的纯净内反打（Clean Single）强调极端内省、孤独与情感总爆发。
  - "视线匹配（Eyeline Match）决定目光相撞真实度：反打镜头中水平偏角必须对称，垂直仰俯角度必须严格互补（$+\theta$ 与 $-\theta$），并留出对称的视线前方呼吸留白（Looking Room）。"
  - 屏幕运动方向代表地理逻辑：从左向右的运动必须跨越切点保持一致，从画右出画必须从画左入画；追逐双方必须同向推进，对决双方必须迎面相撞。
  - 动量是最好的剪辑隐形衣：在角色做功位移速度最大、动量最充沛的中间帧执行动作剪辑（Cutting on Action），利用人脑对动能的专注追踪使物理硬切完全隐形。
  - 长镜头是一台画框内的移动交响乐（The Sequence Shot）：通过演员走位与机位三维推拉摇移，在同一不间断镜头内实现从宏观全景到微观特写的无缝景别转换与情绪推进。
  out_of_scope:
  - 纯工业机械数控车床切削刀具路径代码
  - 静态纸质图书排版装帧与印刷拼版工艺
  - 医学胃镜肠镜组织活检切片化验病理学
  stop_conditions:
  - 用户仅咨询机械数控编程或印刷排版，不涉及影视导演、分镜头脚本、机位调度与视听语言时判停
  - 已输出明确的 180° 轴线布局图、三角形机位参数、合法越轴方案、动量剪辑点帧数或长镜头走位路线时判停
