  frontmatter:
    title: 体块化头发分组与受风飞扬动力学（三棱柱发块与发旋锚点）
    importance: high
    one_liner: 将发丝提炼为具厚度与明暗分面的主次三棱柱发块，锁定发旋物理锚点并模拟高速冲刺破风气流飘拂。
    requirements:
    - 头发造型必须基于三棱柱或片状三维体块分组（主发块、次发块、游离碎发）
    - 所有发束根部必须严格锚定在头顶发旋或自然发际线，禁止悬空浮游
    antirequirements:
    - 严禁绘制没有体块厚度与体积感的单根杂乱细发丝（长毛猕猴桃反模式）
    - 严禁头发完全僵硬板结如水泥头盔（缺乏动能飘逸感）
