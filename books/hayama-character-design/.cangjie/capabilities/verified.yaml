  frontmatter:
    title: 作画监督级原画修正与中割保形规范（线条重量感与运动圆弧）
    importance: core
    one_liner: 运用运笔压感赋予线条重力重量感，建立关键帧修形准则与中割运动圆弧导轨（Motion Arc），杜绝动画抽搐崩坏。
    requirements:
    - 原画线条必须具备物理重力重量感（受光轻灵、承重/阴影交界处厚实坚实）
    - 原画（Keyframes）必须在角标与草图层明确标明中割时序图（Time-chart）与四肢末端运动圆弧导轨（Motion Arc Rails）
    antirequirements:
    - 严禁绘制全画粗细均等、毫无顿挫压感的死板数字矢量线（死线）
    - 严禁原画之间形变路径跳跃，导致中割师无法插值（产生中间画抽搐崩坏）
