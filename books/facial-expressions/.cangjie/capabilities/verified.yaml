  importance: core
  importance_rationale: 该能力是《面部表情艺用解剖》中核心的core级别解剖学与三维形变基座规范。
  one_liner: 解耦内侧眉提升（AU 1）、外侧眉提升（AU 2）与皱眉肌（AU 4）水平挤压，建立正交川字纹与额头水平纹力学。
