  frontmatter:
    title: 枕额肌与降眉间肌-皱眉肌复合动力学（AU 1/2/4）
    importance: core
    one_liner: 解耦内侧眉提升（AU 1）、外侧眉提升（AU 2）与皱眉肌（AU 4）水平挤压，建立正交川字纹与额头水平纹力学。
