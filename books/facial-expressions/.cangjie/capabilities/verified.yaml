  name: facial-expressions
  description: 乌尔迪斯·扎林斯面部表情艺用解剖与表情绑定工程手册。提供头骨刚性标志点、正交张力皱纹定律、额肌皱眉肌解耦、眼轮匝肌真笑闭环、眼外肌扫视跳跃、鼻部与中面部滑移、口轮匝肌同心环与白线守恒、嘴角提升与水平撕扯矢量网络、降口角肌与颏肌橘皮下巴、TMJ
    双阶段张嘴运动学、深浅脂肪垫韧带阻隔与七大核心情绪全参数 FACS 拓扑合成支持。
