  source_pack: "timing-for-animation"
  baseline_tag: "v2.5.0"

entry:
  name: "timing-for-animation"
  description: "动画时间掌握、帧数计算、节奏调校与运动规律工程手册。涵盖时空双轴标尺、慢入慢出缓动、动作预感、多级关节延迟、重量感自由落体、人类双足行走奔跑、四足动物步态、对白口型提前量、摄影机平移防频闪与高速动作跳帧排障。"
  core_principles:
    - "动画的重力与力量不是画出来的，而是由帧数（Timing）与空间位移间距（Spacing）共同决定的。"
    - "任何动作必须满足视知觉闭环：反向预备蓄力（Anticipation）➔ 极速爆发 ➔ 惯性过冲 ➔ 充分停顿（Hold 8-16帧）。"
    - "多级关节必须呈鞭梢状错落延迟到达，严禁所有肢体在同一帧同步停滞。"
    - "人类视觉感知慢于听觉约40毫秒，对白口型与动作重音必须比音频发声点提前1-2帧对齐。"
    - "极速位移严禁画平庸中间画，必须使用 Smear 变形张或速度线桥接以消除视网膜频闪跳帧。"
  out_of_scope:
    - "剧本文学剧作构思与台词写作"
    - "角色概念设定与二维上色美术绘制细节"
    - "3D 角色材质贴图渲染器 Shader 编写"
  stop_conditions:
    - "用户仅需纯文本剧本创作，不涉及动画逐格动作设计时判停"
    - "已完成帧数计算、间距标尺与关键姿态律表输出时判停"

router_entry:
  name: "timing-for-animation"
  description: "《动画的时间掌握》单路由总入口，按用户具体动作任务分发至时空双轴、加减速、预备、关节延迟、重力、步态、口型、摄影机平移等 12 项专业能力卡。"

