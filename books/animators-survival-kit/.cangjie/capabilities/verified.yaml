  title: 时空双轴标尺与原画轨目表设计
  importance: critical
  importance_rationale: 动画工程第一公理，时间（帧数）与空间幅度（位移分布）绝对分离，慢入慢出与偏心轨目图谱
  one_liner: 严格区分耗费物理帧数（时间）与帧间位移距离分布（空间），以轨目表掌控慢入慢出与偏心动力学
  intents:
  - 在原画设计中绘制精准的轨目表 (Spacing Chart) 指导中割补间
  - 区分调整总帧数 (Timing) 与调整帧间距离分布 (Spacing) 解决动作速度与质感缺陷
  - 决策动作段落的一拍一 (On Ones) 与一拍二 (On Twos) 制作规格
