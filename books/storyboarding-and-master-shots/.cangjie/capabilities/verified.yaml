entry:
  name: storyboarding-and-master-shots
  description: 导演视听语言与影视/动画分镜头脚本设计工业级工程手册。涵盖极远景至大特写六级景别心理距离标尺与广角长焦光学透视选择、180度假想动作轴线半球机位守恒与五大合法过轴转场走廊、推拉摇移升降跟物理动机与三维多轴视差运动分层、好莱坞经典主镜头（Master
    Shot）场面覆盖三角剖分与角色走位阻塞三维几何、外侧过肩OTS与内侧单人Clean Single正反打视线高度权力俯仰倾角、动作追逐戏运动矢量一致性与格斗出拳碰撞冲击单帧卡点、连贯性剪辑动作中段切镜（Cut
    on Action）与30度角法则及J/L-Cut声画桥梁、Z轴深度走位与多重画框前景明暗分层、平行/交叉蒙太奇与匹配剪辑（Match Cut）时间折叠、希区柯克炸弹悬念认知不对称与转角隐匿揭示、故事板动态预演（Animatic）时间轴编排与对白提前量Pre-lap波形卡点、单一机位复合走位长镜头覆盖与镜面反射虚实空间折叠全流程工业级实战规范。
  core_principles:
  - 景别心理距离梯次推进律：景别由远及近强制观众建立心理共情，特写与大特写用于戏剧高潮与致命线索揭示，严禁全篇单一中景堆叠。
  - 180度假想动作轴线半球守恒律：机位必须严格保持在动作轴线同一侧半球，确保对角两极视线互补交叉，过轴必须通过五大合法安全走廊之一平滑完成。
  - 摄影机运动有动机律：所有推拉摇移必须严格源于角色物理位移、视线转移或心理聚焦动机，且必须遵循慢入慢出平滑加减速。
  - 好莱坞场面覆盖三角剖分法则：每场戏必须建立从头到尾的Master全景底牌，配合双人中景、过肩对与单人特写构建万无一失的剪辑安全网。
  - 正反打视线高度与朝向留白守恒：正反打机位保持焦距与物理景深对称，视线高度严格互补，面部前方留出2/3的Looking Room呼吸感。
  - 动作动势方向守恒与冲击卡点律：追逐戏保持屏幕运动矢量同向，格斗出拳命中瞬间插入1帧极端特写反向冲击，随后切更宽景别展现击飞受力。
  - 动势剪接掩盖切点律（Cut on Action）：在角色动作进行30%-50%中段切入新景别，利用人眼对运动主体的追踪隐形剪辑痕迹。
  - Z轴深焦调度与三维明暗分层：角色沿Z轴对角线走向镜头制造强烈透视膨胀，利用暗前景→亮中景→暗背景的三明治构图打破扁平舞台感。
  - 交叉剪辑时间轴倒计时锚定律：交叉剪辑必须建立统一的时空倒计时基准，剪辑节奏随时间推进不断缩短制造极限悬念。
  - 希区柯克炸弹悬念信息不对称律：通过让观众比角色知晓更多危机信息制造持续心理煎熬，主观POV镜头必须构建关注者→视点→反应三步闭环。
  - 动态预演对白提前量声画解耦律：对白声音设置8-16帧提前量（Pre-lap / L-Cut），画稿停留时间依据景别与信息复杂度精确测算，杜绝静态PPT幻灯片感。
  - 单一机位复合长镜头走位覆盖律：通过精妙的演员三维走位阻塞，在一条不间断的单一机位长镜头中无缝包容全景、双人过肩与单人特写全部覆盖。
  out_of_scope:
  - 剧本写作与文字台词文学润色（请参阅故事与编剧类相关手册）
  - 角色骨骼动力学肌肉形变与流体物理仿真解算（请参阅运动规律与特效动力学手册）
  - 摄影机硬件电路传感器感光元件制造与光学镀膜化学配比
  stop_conditions:
  - 已为分镜故事板或镜头序列建立清晰的景别焦距、180度轴线平面图、走位阻塞与视线接戏方案
  - 已提供各镜头运镜符号、动作中段切点、动势矢量与动态预演时间轴卡点规范
