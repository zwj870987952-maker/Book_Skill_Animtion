    importance: high
    one_liner: 动作中段切镜隐藏剪辑痕迹、30度机位角安全阈值、J/L-Cut声画桥梁。
    requirements:
    - 动作相接必须在动作完成30%-50%中段切入下一景别，严禁在静止点切镜
    - 连续组接同一主体机位夹角必须大于30度且改变景别，杜绝跳剪抽搐
    - 运用J-Cut音先入与L-Cut画先走平滑声画过渡，消除机械声画同止
    antirequirements:
    - 严禁角色动作完全静止后停留1秒再切入下一镜头（刚性静止切点）
    - 严禁相邻镜头兴趣中心点在屏幕极左与极右之间剧烈跳跃造成视觉盲区
