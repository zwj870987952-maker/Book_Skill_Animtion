    one_liner: 追逐动势矢量守恒、格斗蓄力-高速-命中三拍分镜、单帧冲击撞击卡点。
    requirements:
    - 追逐戏中逃逸者与追击者必须保持完全一致的屏幕行进矢量
    - 格斗出拳击中瞬间插入1帧极端特写反向构图冲击，随后切更宽景别展现击飞受力
    - 保持窄特写打击与宽全景重定位交替的呼吸节律，杜绝全篇碎切失明
    antirequirements:
    - 严禁出拳命中时匀速接触无瞬间停死与受力后仰反应（棉花拳反模式）
    - 严禁动作镜头过度碎切导致观众完全丧失空间方位感
