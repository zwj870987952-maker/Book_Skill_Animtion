  - eyeline-match
  - crossing-the-line
  - spatial-continuity
  also_read:
  - dialogue-shot-reverse-shot-mechanics
  - dynamic-action-and-fight-choreography
  card: cards/axis-of-action-and-180-rule.md
  frontmatter:
    title: 180度轴线铁律与视线空间匹配（假想动作轴线与五大合法过轴技术）
    importance: high
    one_liner: 假想动作轴线确立、半球机位守恒、双人目光对称交叉与五大合法过轴走廊。
    requirements:
    - 所有机位必须严格保持在假想动作轴线同一侧180度半球之内
    - 双人对话特写中两人视线必须呈现互补对撞交叉（左看右 vs 右看左）
    - 过轴必须通过摄影机移动、角色走位、中性视线或空镜插入五大合法走廊之一完成
    antirequirements:
    - 严禁未经转场硬切到轴线对侧引发恶性跳轴与视线撞车
    - 严禁追逐戏中逃逸者与追击者屏幕行进方向相反造成迎面相撞假象
