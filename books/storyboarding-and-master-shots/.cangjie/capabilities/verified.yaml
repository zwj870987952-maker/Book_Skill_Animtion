  importance: high
  importance_rationale: 该能力是《影视分镜头脚本设计与大师镜头语法工程手册》中核心的 high 级别导演视听与分镜设计规范。
  one_liner: 假想动作轴线确立、半球机位守恒、双人目光对称交叉与五大合法过轴走廊。
  intents:
  - 如何实现180度轴线铁律与视线空间匹配（假想动作轴线与五大合法过轴技术）
