    title: 景别体系与光学焦距（极远景至大特写心理距离标尺与广角长焦选择）
    importance: high
    one_liner: 六级景别叙事心理学标尺、广角透视夸张与长焦空间压缩光学选择、画幅构图。
    requirements:
    - 景别设计必须根据戏剧高潮层级递进（建立环境ELS/FS→讨论MS→情绪爆发CU）
    - 肖像与情感特写严格选用85mm-105mm中长焦，避免广角贴面脸部畸变
