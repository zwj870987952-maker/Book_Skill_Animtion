bundle_id: bundle.force-character-design
book:
  title: 动画师角色设计动态速写：Force 人物概念与戏剧造型工程手册
  source_pack: books/force-character-design
  edition: 1st Edition
  authors:
  - Mike Mattesi
  year: 2008
entry:
  name: force-character-design
  description: 动画角色设计、概念造型速写、戏剧夸张与视线调度工业工程手册。涵盖主观观点与金字塔层级设计哲学、极限推挤姿态与 45° 强角施加力、空间包围盒系统（尺寸即深度与位置即深度）、力量形状抽象与动能引导三角形、形状包围盒与三分法则不对称黄金分割（Apex
    1/3 加速度）、面部戏剧化比例重构与五官特征解构、3-4 阶黑白灰明度层次与焦点舞台调度、色彩心理学冷暖对比与生活服装叙事、现场街头纪实速写向风格化角色演化、多角色群戏排版与镜头视线闭环、环境场景与建筑体量拟人化生命律动、动物拟人化与兽性向人性性格重构工程法则。
  core_principles:
  - 角色设计是画师对被画对象的主观评判与态度（Opinion）；克服恐惧并拥抱风险，绝不做照相机式的被动客观临摹。
  - 严格遵循金字塔层级理论（Hierarchy Pyramid）：故事与性格内核第一，主力量流线第二，空间包围盒第三，几何形状第四，明度色彩与细节最末。
  - 将写实姿态推向 120%-150% 物理极限；应用 45° 神奇角度施加力激发最高弹性反弹曲率与戏剧张力。
  - 空间深度由两大定律确立：尺寸即深度（近大远小极端透视缩短）与位置即深度（地平面垂直落差与重叠遮挡）。
  - 力量曲线严禁 50% 几何居中对称（死水病）；最高顶点必须偏向 1/3 或 2/3（三分法则），赋予线条鲜明的推进加速度。
  - 打破面部三庭五眼 1:1:1 均分网格，通过主观拉伸或压缩下巴、额头与五官间距塑造独一无二的角色性格符号。
  - 全画明度受控于 3-4 阶大明度系统，将最强黑白对比精准锚定在叙事焦点；服装道具必须体现生活磨损与重力配重代偿。
  out_of_scope:
  - 纯医学法医颅骨复原与人脸生物特征识别算法
  - 机械工程工业零件 CAD 正交轴测图绘制与力学有限元网格剖分
  - 商业建筑施工工程结构荷载计算书编制
  stop_conditions:
  - 用户仅咨询纯法医颅骨鉴定、工业数控图纸或建筑施工荷载计算，不涉及角色设计、动态速写与造型艺术时判停
  - 已输出明确的主观观点提炼、45度角姿态推挤方案、空间包围盒步骤、面部比例重构或角色群戏排版方案时判停
