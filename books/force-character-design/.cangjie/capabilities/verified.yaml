  slug: spatial-bounding-box-depth
  title: 空间包围盒系统：尺寸与位置决定深度
  importance: critical
  importance_rationale: 突破二维平面的三维进深支柱，尺寸即深度与位置即深度两大定律消除扁平剪纸感
  one_liner: 以六面体空间包围盒为骨架，通过近大远小尺寸暴增与地平面垂直位置高低，构建极致透视压迫感
  intents:
  - 在二维纸面构建角色体块的三维空间进深与体积
  - 应用尺寸即深度定律处理剧烈透视缩短 (Foreshortening)
  - 运用位置即深度定律与重叠遮挡界定空间绝对坐标
  keywords:
