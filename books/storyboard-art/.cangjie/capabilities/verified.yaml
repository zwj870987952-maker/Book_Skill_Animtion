schema_version: 1
bundle_id: bundle.storyboard-art
book:
  title: 开拍之前：故事板的艺术 (The Art of the Storyboard)
  source_pack: books/storyboard-art
  edition: 2nd Illustrated Edition
  authors:
  - John Hart
  year: 2008
entry:
  name: storyboard-art
  description: 好莱坞影视工业与全球动画前期制作标准化分镜实战工程手册。建立故事板画师与导演、摄影指导、剪辑师及三维布局团队无歧义协同的标准视觉语言。涵盖
    1.33:1, 1.85:1, 2.39:1 画幅几何学与 90% 动作/80% 字幕安全框（Action/Title Safe）、ELS 至 ECU 七级人体解剖非关节黄金裁切标尺、摄影机运动双线空心箭头系统（Pan,
    Tilt, Dolly, Zoom, Crane, Track）、角色位移细实心箭头与出入画语法（E.F. / X.F.）、视平线与摄影机高度等价铁律与一/二/三点透视网格、广角大透视
    vs 长焦空间扁平压缩情绪、三分法则九宫格交叉点与视线呼吸留白（Looking Room）、三阶极简明暗调（白、50%灰、黑）与纯黑剪影测试、180°动作轴线守恒与追逐/对峙屏幕矢量连续性、硬切/叠化/淡黑/匹配剪辑（Match
    Cut）光学转场语法、动态故事板（Animatic）非线性编辑对白导轨与时间线节奏排障、15秒/30秒商业广告四段式黄金结构（Hook, Pain Point,
    Solution, Brand Lock），以及动作大戏蓄力-击打-受击反应三步曲与动量隐形剪辑（Cutting on Action）全流程工业规范。
  core_principles:
  - 故事板是工业蓝图而非纯艺术插画：核心价值在于视觉沟通的绝对准确度与现场工业可执行性。
  - 符号系统零歧义铁律：摄影机运动一律采用画框外侧或跨框双线空心大箭头；主体位移一律采用画框内部细实心箭头或虚线轨迹。
  - 人体景别非关节裁切铁律：绝对禁止在人体自然关节处（颈、肘、腕、膝、踝）横向裁切，永远切在长骨肌肉饱满的中段。
  - 视平线等价铁律：画面中透视视平线（Horizon Line）高度在物理上严格等于摄影机镜头的离地绝对高度。
  - 180°动作轴线守恒：机位必须永久锁定在假想轴线同侧半圆内；追逐戏保持同向屏幕矢量，对峙戏保持对撞相向。
  - 视线呼吸留白（Looking Room）守恒：角色面朝方向前方必须预留至少占画幅宽度 50%-70% 的开阔负空间。
  - 三阶极简明暗（Three-Tone System）：画面精简提炼为纯白、50%中灰与纯黑，主体必须 100% 通过纯黑剪影测试。
  - 动态故事板（Animatic）前置排障：在实拍和三维资产制作前，通过装配对白导轨的时间线测试，就地消灭叙事拖沓与节奏病灶。
  out_of_scope:
  - 纯工业机械模具注塑成型与数控铣削工艺
  - 静态纸质书籍印刷拼版与油墨配比化验
  - 医学牙科种植牙与颌面外科手术临床操作
  stop_conditions:
  - 用户仅咨询机械注塑或印刷牙科临床医学，不涉及影视导演、分镜头设计、视听语言与前期动画预演时判停
  - 已输出明确的标准分镜画框参数、机位运镜箭头图、景别裁切线、180° 轴线图、商业广告时间分配或 Animatic 剪辑表时判停
