    importance: core
    one_liner: 解析学院画幅、宽银幕与变形宽银幕画框张力，确立 90% 动作安全框与 80% 字幕安全框工业标准。
    requirements:
    - 故事板面板必须预先锁定确切的画幅宽高比（1.33:1 / 1.85:1 / 2.39:1）
    - 核心动作必须限制在 90% 动作安全框内，对白字幕与核心信息严格收拢于 80% 字幕安全框内
    antirequirements:
    - 严禁随意手绘不规则比例的自由画框
    - 严禁将关键剧情道具或人物面部放置在安全框外边缘导致被裁切
