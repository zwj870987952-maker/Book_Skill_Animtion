    importance: core
    one_liner: 锁定假想轴线同侧半圆机位，保持屏幕运动矢量守恒，杜绝无意识跳轴与方向翻转灾难。
    requirements:
    - 摄影机必须永久锁定在互动主体假想 180° 动作轴线的同侧半圆内
