  importance_rationale: 该能力是《开拍之前：故事板的艺术》中核心的core级别工业分镜设计规范。
  one_liner: 锁定假想轴线同侧半圆机位，保持屏幕运动矢量守恒，杜绝无意识跳轴与方向翻转灾难。
