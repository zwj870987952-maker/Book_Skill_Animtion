  - 排查动作大戏分镜拆解与多面板连续动态编排（蓄力-击打-反应三步曲）相关的常见分镜反模式与错误
  keywords: &id002
  - action-choreography
  - storyboard-breakdown
  - anticipation
  - impact-frame
  - follow-through
  - cutting-on-action
  - kinetic-energy
  also_read: &id003
  - continuity-axis-screen-direction
  - subject-action-directional-arrows
  card: cards/action-choreography-breakdown.md
  frontmatter:
    title: 动作大戏分镜拆解与多面板连续动态编排（蓄力-击打-反应三步曲）
    importance: core
    one_liner: 编排准备势（Anticipation）、打击破坏高潮（Impact Frame）与受击反应缓冲（Follow-through）的动量隐形剪辑。
    requirements:
    - 动作连招必须严格拆解为蓄力预备、破坏击打与受击反应三部曲闭环
    - 剪辑切点必须落在动能做功最高峰的中间帧（Cutting on Action）以实现隐形蒙太奇
    antirequirements:
    - 严禁在动作完全停止站定之后才切镜头（产生严重视觉急刹车与拖沓）
    - 严禁击打瞬间双方肢体无实质受力接触点（假打穿帮）
    intents: *id001
    keywords: *id002
    sources: &id004
    - source_id: hart-art-of-the-storyboard-2008
      citation: The Art of the Storyboard - Part 3 - Staging the Action Sequence &
        Storyboard Breakdown (P160-195)
      excerpt: 编排准备势（Anticipation）、打击破坏高潮（Impact Frame）与受击反应缓冲（Follow-through）的动量隐形剪辑。
    also_read: *id003
