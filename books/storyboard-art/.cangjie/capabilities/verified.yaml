    one_liner: 将静态面板导入非线性编辑时间线，装配导轨对白与节拍器，在实拍前就地消灭叙事拖沓与节奏病灶。
    requirements:
    - 必须将静态故事板面板按照真实剧本秒数导入时间线构建动态故事板（Animatic）
