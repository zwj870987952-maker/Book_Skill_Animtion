  title: 动作大戏分镜拆解与多面板连续动态编排（蓄力-击打-反应三步曲）
  importance: core
  importance_rationale: 该能力是《开拍之前：故事板的艺术》中核心的core级别工业分镜设计规范。
  one_liner: 编排准备势（Anticipation）、打击破坏高潮（Impact Frame）与受击反应缓冲（Follow-through）的动量隐形剪辑。
  intents: &id001
