  title: 跟随动作与动作重叠：多级滞后波浪与动能余震
  importance: critical
  importance_rationale: 打破机械人偶同步起止，重心主动力源先行，柔性被动组织多级滞后波浪与刹车超量甩动
  one_liner: 主动力源先行，柔性附属物与松弛组织多级滞后拖尾跟随，刹车时产生超量正弦衰减摆动
  intents:
  - 编排角色头发、长耳、尾巴与衣服下摆的滞后拖尾 (Drag) 与跟随动作 (Follow Through)
